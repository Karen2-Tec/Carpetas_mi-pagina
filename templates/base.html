<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnieStyle - Urban Streetwear & Drops{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="urban-body">

    <div id="loading-spinner" class="d-none position-fixed top-50 start-50 translate-middle z-3 bg-dark bg-opacity-75 w-100 h-100 d-flex justify-content-center align-items-center">
        <div class="spinner-border text-danger" style="width: 4rem; height: 4rem;" role="status">
            <span class="visually-hidden">Cargando Drop...</span>
        </div>
    </div>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-urban">
            <div class="container-fluid px-4">
                <a class="navbar-brand brand-title" href="{{ url_for('index') }}">Anie<span>Style</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto text-center">
                        <a class="nav-link text-uppercase fw-bold mx-2 {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">Inicio</a>
                        <a class="nav-link text-uppercase fw-bold mx-2 {% if request.path == '/productos' %}active{% endif %}" href="{{ url_for('productos_view') }}">Productos</a>
                        <a class="nav-link text-uppercase fw-bold mx-2 {% if request.path == '/clientes' %}active{% endif %}" href="{{ url_for('clientes_view') }}">Clientes</a>
                        <a class="nav-link text-uppercase fw-bold mx-2 {% if request.path == '/proveedores' %}active{% endif %}" href="{{ url_for('proveedores_view') }}">Proveedores</a>
                        <a class="nav-link text-uppercase fw-bold mx-2 {% if request.path == '/facturacion' %}active{% endif %}" href="{{ url_for('facturacion_view') }}">Facturación</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 py-4 px-3 px-md-5 urban-main-container">
        {% block content %}
        {% endblock %}
    </main>

    <div class="modal fade" id="dropDetailModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border border-secondary">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title text-uppercase fw-bold text-danger" id="modalTitle">Detalle del Drop</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body fs-6" id="modalBodyContent">
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-secondary text-uppercase fw-bold" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center pt-4 pb-5 border-top border-secondary border-opacity-25">
        <p class="mb-1 text-muted-urban">Desarrollado por: <strong class="text-white">Karen Infante</strong></p>
        <p class="small text-muted-urban">Estructura segmentada orientada a Rutas Independientes - Proyecto Integrador</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
